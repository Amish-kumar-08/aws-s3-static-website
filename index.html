
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My AWS S3 Website</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #0f172a;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            text-align: center;
        }

        .container {
            max-width: 650px;
            padding: 40px;
        }

        h1 {
            font-size: 42px;
            color: #38bdf8;
        }

        p {
            font-size: 18px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        .tag {
            display: inline-block;
            padding: 12px 24px;
            background: #0284c7;
            border-radius: 8px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hello from Amazon S3!</h1>
        <p>
            This static website is hosted on Amazon S3
            and provisioned using Terraform.
        </p>
        <div class="tag">
            AWS + Terraform Deployment
        </div>
    </div>
</body>
</html>
